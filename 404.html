<style>

:root{
  --ink:#15120e; --ink-soft:#1d1a15; --parchment:#ece2cc; --parchment-dim:#c9bd9f;
  --wine:#6d2027; --wine-bright:#8a2b32; --gold:#a9834f; --stone:#85806f; --line:rgba(236,226,204,0.14);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  -webkit-user-select:none;
  -moz-user-select:none;
  user-select:none;
  cursor:default;
}
.ig-line a{-webkit-user-select:text;user-select:text;cursor:pointer;}
html,body{height:100%;}
body{
  background:radial-gradient(ellipse at 50% 30%,rgba(169,131,79,0.10),transparent 60%),var(--ink);
  color:var(--parchment);
  font-family:'Inter',sans-serif;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:32px;
  text-align:center;
}
h1,h2,h3{font-family:'Fraunces',serif;font-weight:500;}
a{color:inherit;}

.gate{max-width:420px;}

.logo{
  width:110px;
  height:auto;
  margin:0 auto 28px;
  display:block;
  filter:drop-shadow(0 0 24px rgba(169,131,79,0.25)) invert(80%);
}

.eyebrow{
  font-family:'JetBrains Mono',monospace;
  font-size:1rem;
  letter-spacing:0.18em;
  text-transform:uppercase;
  color:var(--gold);
  margin-bottom:14px;
}

h1{
  font-size:clamp(1.6rem,4vw,2.2rem);
  color:var(--parchment);
  margin-bottom:14px;
}

p.sub{
  color:var(--parchment-dim);
  font-size:0.98rem;
  max-width:360px;
  margin:0 auto 30px;
}

.back-link{
  font-family:'JetBrains Mono',monospace;
  font-size:0.78rem;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--parchment-dim);
  text-decoration:none;
  border:1px solid var(--line);
  padding:12px 22px;
  display:inline-block;
  transition:all 0.2s ease;
}
.back-link:hover{border-color:var(--gold);color:var(--parchment);}

.ig-line{
  margin-top:22px;
  font-family:'JetBrains Mono',monospace;
  font-size:1rem;
  color:var(--stone);
}
.ig-line a{color:#3897f0;text-decoration:none;}
.ig-line a:hover{text-decoration:underline;}

</style>
</head>
